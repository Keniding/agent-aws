AWSTemplateFormatVersion: "2010-09-09"
Description: Sistema de incidencias - Lambda Function URL (web+API), DynamoDB y harness de AgentCore

Parameters:
  LambdaRuntime:
    Type: String
    Description: Lambda runtime id matching the Python that built the package (derived in CI)
  HarnessName:
    Type: String
    Default: asistente_incidencias
  CodeBucket:
    Type: String
  CodeKey:
    Type: String

Resources:
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: id, AttributeType: S}]
      KeySchema: [{AttributeName: id, KeyType: HASH}]
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  HarnessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: bedrock-agentcore.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {"aws:SourceAccount": !Ref AWS::AccountId}
              ArnLike: {"aws:SourceArn": !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"}
      Policies:
        - PolicyName: harness
          PolicyDocument:
            Version: "2012-10-17"
            # Subconjunto de AmazonBedrockAgentCoreHarnessExecutionPolicy (la que crea la consola),
            # sin navegador, EFS, S3 Files ni memoria, que este harness no usa.
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource: !Sub "arn:${AWS::Partition}:bedrock-mantle:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action: [bedrock-mantle:CallWithBearerToken, sts:GetServiceBearerToken,
                         ecr-public:GetAuthorizationToken, ecr:GetAuthorizationToken,
                         xray:PutTraceSegments, xray:PutTelemetryRecords,
                         xray:GetSamplingRules, xray:GetSamplingTargets]
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:*:repository/harness-*"
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:DescribeLogStreams, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"
              - Effect: Allow
                Action: [logs:DescribeLogGroups, logs:PutResourcePolicy]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition: {StringEquals: {"cloudwatch:namespace": bedrock-agentcore}}
              - Effect: Allow  # memoria de sesión (activa por defecto en los harness creados por API)
                Action: [bedrock-agentcore:CreateEvent, bedrock-agentcore:DeleteEvent,
                         bedrock-agentcore:GetEvent, bedrock-agentcore:ListEvents,
                         bedrock-agentcore:RetrieveMemoryRecords]
                Resource: !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:memory/${HarnessName}-*"
              - Effect: Allow
                Action: [bedrock-agentcore:GetWorkloadAccessToken,bedrock-agentcore:GetWorkloadAccessTokenForJWT]
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default"
                  - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/*"

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: invoke-harness
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [bedrock-agentcore:InvokeHarness, bedrock-agentcore:InvokeAgentRuntime]
                Resource: "*"
              - Effect: Allow
                Action: bedrock-agentcore:ListHarnesses
                Resource: "*"
              - Effect: Allow
                Action: [dynamodb:Scan, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt IncidentsTable.Arn

  Function:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: !Ref LambdaRuntime
      Handler: app.handler
      Role: !GetAtt FunctionRole.Arn
      Timeout: 120
      MemorySize: 256
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey}
      Environment:
        Variables: {HARNESS_NAME: !Ref HarnessName, TABLE_NAME: !Ref IncidentsTable}

  Url:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE # público; add AWS_IAM or CloudFront+WAF before real use
  UrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  HarnessRoleArn: {Value: !GetAtt HarnessRole.Arn}
  WebUrl: {Value: !GetAtt Url.FunctionUrl}
