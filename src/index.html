<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent demo</title>
<style>
body{font:16px system-ui;max-width:42rem;margin:2rem auto;padding:0 1rem}
#log{border:1px solid #8885;border-radius:8px;padding:1rem;min-height:12rem;white-space:pre-wrap}
form{display:flex;gap:.5rem;margin-top:1rem}input{flex:1;padding:.6rem}button{padding:.6rem 1rem}
.u{font-weight:600}.e{color:#b00}
</style></head><body>
<h1>AgentCore harness demo</h1><div id="log"></div>
<form id="f"><input id="m" autocomplete="off" placeholder="Escribe un mensaje" required><button>Enviar</button></form>
<script>
let sid=localStorage.sid||null;const log=document.getElementById('log');
function add(c,t){const d=document.createElement('div');d.className=c;d.textContent=t;log.append(d);return d}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();
 const m=document.getElementById('m');const text=m.value;m.value='';add('u','Tú: '+text);
 const w=add('','…');
 try{const r=await fetch('',{method:'POST',headers:{'content-type':'application/json'},
  body:JSON.stringify({message:text,session_id:sid})});const j=await r.json();
  if(!r.ok)throw new Error(j.error);sid=localStorage.sid=j.session_id;w.textContent='Agente: '+j.reply}
 catch(err){w.className='e';w.textContent='Error: '+err.message}};
</script></body></html>
