<!doctype html>
<html lang="es" data-theme="auto"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Incidencias</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Hanken+Grotesk:wght@400;600&family=JetBrains+Mono&display=swap">
<style>
/* Tokens del sistema "Humanismo Editorial": pigmentos + semánticos (Papel / Tinta / Alto contraste) */
:root{
 --color-terracotta-base:#cc5a3f;--color-terracotta-deep:#b54832;--color-bone-paper:#f5f2eb;
 --color-bone-parchment:#faf6f0;--color-sage-moss:#7d8d78;--color-cypress-teal:#244038;
 --color-amber-pollen:#e5ac44;--color-carbon-ink:#191919;--color-seaglass-mist:#bdd2cb;
 --surface:#f5f2eb;--surface-raised:#faf6f0;--ink:#191919;--ink-muted:#244038;--rule:#244038;
 --grid-line:rgba(36,64,56,.16);--accent:#b54832;--on-accent:#f5f2eb;--accent-field:#cc5a3f;
 --on-accent-field:#f5f2eb;--status-note:#bdd2cb;--status-valid:#7d8d78;--status-warning:#e5ac44;
 --status-critical:#b54832;--on-status:#191919;--focus:#244038;
 --display:"EB Garamond",Garamond,"Times New Roman",serif;
 --sans:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
 --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
 --space-1:4px;--space-2:8px;--space-4:16px;--space-8:32px;--space-16:64px;--space-grid:19px;
}
:root[data-theme=dark]{--surface:#171b19;--surface-raised:#212725;--ink:#f5f2eb;--ink-muted:#bdd2cb;
 --rule:#6f7d76;--grid-line:rgba(189,210,203,.10);--accent:#e27a5f;--on-accent:#191919;
 --status-valid:#94a58f;--status-critical:#e27a5f;--focus:#e5ac44}
:root[data-theme=contrast]{--rule:#191919;--grid-line:rgba(25,25,25,.30);--accent:#8a3320;
 --accent-field:#b54832;--status-valid:#b3c0ae;--status-critical:#8a3320;--focus:#191919;--ink-muted:#244038}
@media(prefers-color-scheme:dark){:root[data-theme=auto]{--surface:#171b19;--surface-raised:#212725;
 --ink:#f5f2eb;--ink-muted:#bdd2cb;--rule:#6f7d76;--grid-line:rgba(189,210,203,.10);--accent:#e27a5f;
 --on-accent:#191919;--status-valid:#94a58f;--status-critical:#e27a5f;--focus:#e5ac44}}
@media(prefers-contrast:more){:root[data-theme=auto]{--rule:#191919;--grid-line:rgba(25,25,25,.30);
 --accent:#8a3320;--accent-field:#b54832;--status-valid:#b3c0ae;--status-critical:#8a3320;--focus:#191919}}

*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font:400 16px/26px var(--sans);
 background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
 background-size:var(--space-grid) var(--space-grid)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.label{font:600 12px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--ink-muted)}
.small{font-size:14px;line-height:22px}

/* Lámina: campo terracota con grafo + titular */
header{background:var(--accent-field);color:var(--on-accent-field);padding:var(--space-8);
 display:grid;grid-template-columns:1fr auto;gap:var(--space-8);align-items:end;
 border-bottom:1px solid var(--rule)}
header h1{font:500 64px/68px var(--display);letter-spacing:-.01em;margin:0}
header h1 span{color:var(--color-carbon-ink)}
header p{font:italic 400 24px/32px var(--display);margin:var(--space-2) 0 0}
.tag{display:inline-block;background:var(--color-bone-parchment);color:var(--color-carbon-ink);
 padding:var(--space-1) var(--space-2);margin-bottom:var(--space-4)}
header svg{width:120px;height:120px}
main{display:grid;grid-template-columns:3fr 2fr;gap:var(--space-8);padding:var(--space-8);max-width:1200px;margin:0 auto}
.col{display:grid;gap:var(--space-8);align-content:start;min-width:0}
.card{background:var(--surface-raised);border:1px solid var(--rule);padding:var(--space-4)}
.card h2{font:500 28px/34px var(--display);margin:var(--space-2) 0 var(--space-4)}
label{display:block;margin-top:var(--space-4)}
input,textarea,select{display:block;width:100%;font:inherit;color:var(--ink);background:var(--surface);
 border:1px solid var(--rule);border-radius:2px;padding:var(--space-2);margin-top:var(--space-1)}
textarea{resize:vertical}
button{font:600 12px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
 background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:2px;
 padding:var(--space-2) var(--space-4)}
button.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
button[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button:disabled{opacity:.6;cursor:progress}
.row{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.counts{display:flex;gap:var(--space-4);flex-wrap:wrap}
.inc{border-top:1px solid var(--rule);padding:var(--space-4) 0}
.inc:first-of-type{border-top:0;padding-top:0}
.inc h3{font:500 22px/28px var(--display);margin:var(--space-1) 0}
.inc.resuelta h3{text-decoration:line-through;color:var(--ink-muted)}
.sev{display:inline-block;padding:0 var(--space-2);background:var(--surface);border:1px solid var(--rule)}
.sev.media{background:var(--status-note);color:var(--on-status);border-color:transparent}
.sev.alta{background:var(--status-warning);color:var(--on-status);border-color:transparent}
.sev.critica{background:var(--status-critical);color:var(--on-accent);border-color:transparent}
.sev.baja{background:var(--status-valid);color:var(--on-status);border-color:transparent}
.steps{margin:var(--space-1) 0 0;padding:0;list-style:none;font-family:var(--mono);font-size:14px;line-height:22px}
.steps li::before{content:"► "}
.inc select{width:auto;display:inline-block;margin:var(--space-2) 0 0}
#log{display:grid;gap:var(--space-4);min-height:7rem;margin-bottom:var(--space-4)}
#log .msg{white-space:pre-wrap}
.err{color:var(--accent);font-weight:600}
.themes{display:flex;gap:var(--space-1);justify-content:flex-end;padding:var(--space-2) var(--space-8) 0}
@media(max-width:820px){main{grid-template-columns:1fr;padding:var(--space-4)}
 header{grid-template-columns:1fr;padding:var(--space-4)}header h1{font-size:44px;line-height:50px}header svg{display:none}}
</style></head><body>
<nav class="themes" aria-label="Tema">
 <span class="label muted" style="align-self:center">Tema //</span>
 <button class="ghost" data-theme="auto" aria-pressed="true">Auto</button>
 <button class="ghost" data-theme="light" aria-pressed="false">Papel</button>
 <button class="ghost" data-theme="dark" aria-pressed="false">Tinta</button>
 <button class="ghost" data-theme="contrast" aria-pressed="false">Alto contraste</button>
</nav>
<header>
 <div><span class="tag label">Sistema // Operaciones // Registro</span>
  <h1>Inciden<span>cias</span></h1>
  <p>Registro, clasificación y seguimiento asistido.</p></div>
 <svg viewBox="0 0 120 120" role="img" aria-label="Grafo de nodos">
  <g stroke="var(--color-carbon-ink)" stroke-width="3"><path d="M24 30L70 20M70 20L96 62M24 30L40 86M40 86L96 62M70 20L40 86"/></g>
  <g fill="var(--color-bone-parchment)"><circle cx="24" cy="30" r="10"/><circle cx="70" cy="20" r="8"/>
  <circle cx="96" cy="62" r="11"/><circle cx="40" cy="86" r="9"/></g></svg>
</header>
<main>
 <div class="col">
  <form id="new" class="card"><span class="label muted">Alta // Nueva incidencia</span>
   <h2>Registrar</h2>
   <label for="t" class="label">Título</label>
   <input id="t" maxlength="200" required>
   <label for="d" class="label">Descripción</label>
   <textarea id="d" rows="3" placeholder="Sistema afectado, impacto, desde cuándo…"></textarea>
   <div class="row" style="margin-top:var(--space-4)"><button id="go">Registrar y clasificar</button>
    <span id="ns" class="small muted" role="status"></span></div>
  </form>
  <section class="card" aria-labelledby="lt"><span class="label muted">Registro // Incidencias</span>
   <h2 id="lt">Lista</h2>
   <div class="counts label" id="counts"></div>
   <div class="row" id="filters" style="margin:var(--space-4) 0" role="group" aria-label="Filtro">
    <button class="ghost" data-f="all" aria-pressed="true">Todas</button>
    <button class="ghost" data-f="abierta" aria-pressed="false">Abiertas</button>
    <button class="ghost" data-f="en_curso" aria-pressed="false">En curso</button>
    <button class="ghost" data-f="resuelta" aria-pressed="false">Resueltas</button></div>
   <div id="list" aria-live="polite"></div></section>
 </div>
 <div class="col"><section class="card" aria-labelledby="at"><span class="label muted">Asistente // Consulta</span>
  <h2 id="at">Preguntar</h2>
  <div id="log" aria-live="polite"><div class="small muted">Pregunta por las incidencias abiertas: prioridades, patrones, qué atender primero.</div></div>
  <form id="chat"><label for="m" class="label" style="margin-top:0">Mensaje</label>
   <input id="m" required maxlength="2000" autocomplete="off">
   <div class="row" style="margin-top:var(--space-4)"><button id="send">Enviar</button></div></form>
 </section></div>
</main>
<script>
const $=id=>document.getElementById(id),LABEL={abierta:'Abierta',en_curso:'En curso',resuelta:'Resuelta'},SEV={critica:'crítica',sin_clasificar:'sin clasificar'};
let sid=null,items=[],filter='all';
try{sid=localStorage.getItem('sid')}catch{}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
async function api(path,method,body){
 const r=await fetch(path,method?{method,headers:{'content-type':'application/json'},body:JSON.stringify(body)}:undefined);
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch{}
 document.querySelectorAll('.themes [data-theme]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===t))}
document.querySelectorAll('.themes [data-theme]').forEach(b=>b.onclick=()=>setTheme(b.dataset.theme));
try{setTheme(localStorage.getItem('theme')||'auto')}catch{}

function render(){
 const n=s=>items.filter(i=>i.status===s).length;
 $('counts').textContent=`Abiertas ${n('abierta')} // En curso ${n('en_curso')} // Resueltas ${n('resuelta')}`;
 document.querySelectorAll('#filters [data-f]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===filter));
 const vis=items.filter(i=>filter==='all'||i.status===filter);
 $('list').replaceChildren(...(vis.length?vis.map(card):[el('p','small muted','Sin incidencias en esta vista.')]));
}
function card(i){
 const d=el('article','inc '+i.status);d.dataset.id=i.id;
 const top=el('div','row');top.append(el('span','sev label '+i.severity,SEV[i.severity]||i.severity),
  el('span','label muted',(i.category?i.category+' // ':'')+LABEL[i.status]));d.append(top,el('h3',null,i.title));
 if(i.summary)d.append(el('div','small',i.summary));
 if(i.description)d.append(el('div','small muted',i.description));
 if(i.next_steps&&i.next_steps.length){const u=el('ul','steps');i.next_steps.forEach(s=>u.append(el('li',null,s)));d.append(u)}
 const s=el('select');s.setAttribute('aria-label','Estado de '+i.title);
 Object.entries(LABEL).forEach(([v,t])=>{const o=el('option',null,t);o.value=v;o.selected=v===i.status;s.append(o)});
 s.onchange=async()=>{try{const u=await api('/api/incidents/'+i.id,'PATCH',{status:s.value});
  items=items.map(x=>x.id===u.id?u:x);render()}catch(e){alert(e.message);load()}};
 d.append(s);return d}
async function load(){try{items=await api('/api/incidents');render()}catch(e){$('list').replaceChildren(el('p','err','Error: '+e.message))}}
document.querySelectorAll('#filters [data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});

$('new').onsubmit=async e=>{e.preventDefault();const b=$('go');b.disabled=true;$('ns').textContent='Clasificando…';
 try{await api('/api/incidents','POST',{title:$('t').value,description:$('d').value});$('new').reset();$('ns').textContent='Registrada.';await load()}
 catch(x){$('ns').textContent='';$('ns').append(el('span','err','Error: '+x.message))}finally{b.disabled=false}};
$('chat').onsubmit=async e=>{e.preventDefault();const q=$('m').value,b=$('send');$('m').value='';b.disabled=true;
 const log=$('log');if(!log.querySelector('.msg'))log.replaceChildren();
 const u=el('div','msg');u.append(el('div','label muted','Tú //'),el('div',null,q));
 const a=el('div','msg');const t=el('div',null,'…');a.append(el('div','label muted','Asistente //'),t);log.append(u,a);
 try{const j=await api('/api/chat','POST',{message:q,session_id:sid});sid=j.session_id;try{localStorage.setItem('sid',sid)}catch{}t.textContent=j.reply}
 catch(x){t.className='err';t.textContent='Error: '+x.message}finally{b.disabled=false}};
load();
</script></body></html>
