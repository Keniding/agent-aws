<!doctype html>
<html lang="es" data-theme="auto"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Incidencias</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Hanken+Grotesk:wght@400;600&family=JetBrains+Mono&display=swap">
<style>
/* Tokens del sistema "Humanismo Editorial": pigmentos + semánticos (Papel / Tinta / Alto contraste) */
:root{
 --color-terracotta-base:#cc5a3f;--color-terracotta-deep:#b54832;--color-bone-paper:#f5f2eb;
 --color-bone-parchment:#faf6f0;--color-sage-moss:#7d8d78;--color-cypress-teal:#244038;
 --color-amber-pollen:#e5ac44;--color-carbon-ink:#191919;--color-seaglass-mist:#bdd2cb;
 --surface:#f5f2eb;--surface-raised:#faf6f0;--ink:#191919;--ink-muted:#244038;--rule:#244038;
 --grid-line:rgba(36,64,56,.16);--accent:#b54832;--on-accent:#f5f2eb;--accent-field:#cc5a3f;
 --on-accent-field:#f5f2eb;--status-note:#bdd2cb;--status-valid:#7d8d78;--status-warning:#e5ac44;
 --status-critical:#b54832;--on-status:#191919;--focus:#244038;
 --display:"EB Garamond",Garamond,"Times New Roman",serif;
 --sans:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
 --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
 --space-1:4px;--space-2:8px;--space-4:16px;--space-8:32px;--space-16:64px;--space-grid:19px;
}
:root[data-theme=dark]{--surface:#171b19;--surface-raised:#212725;--ink:#f5f2eb;--ink-muted:#bdd2cb;
 --rule:#6f7d76;--grid-line:rgba(189,210,203,.10);--accent:#e27a5f;--on-accent:#191919;
 --status-valid:#94a58f;--status-critical:#e27a5f;--focus:#e5ac44}
:root[data-theme=contrast]{--rule:#191919;--grid-line:rgba(25,25,25,.30);--accent:#8a3320;
 --accent-field:#b54832;--status-valid:#b3c0ae;--status-critical:#8a3320;--focus:#191919;--ink-muted:#244038}
@media(prefers-color-scheme:dark){:root[data-theme=auto]{--surface:#171b19;--surface-raised:#212725;
 --ink:#f5f2eb;--ink-muted:#bdd2cb;--rule:#6f7d76;--grid-line:rgba(189,210,203,.10);--accent:#e27a5f;
 --on-accent:#191919;--status-valid:#94a58f;--status-critical:#e27a5f;--focus:#e5ac44}}
@media(prefers-contrast:more){:root[data-theme=auto]{--rule:#191919;--grid-line:rgba(25,25,25,.30);
 --accent:#8a3320;--accent-field:#b54832;--status-valid:#b3c0ae;--status-critical:#8a3320;--focus:#191919}}


*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font:400 16px/26px var(--sans);
 background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
 background-size:var(--space-grid) var(--space-grid)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.label{font:600 12px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--ink-muted)}
.small{font-size:14px;line-height:22px}
[hidden]{display:none!important}

/* Lámina compacta */
header{background:var(--accent-field);color:var(--on-accent-field);padding:var(--space-4) var(--space-8);
 display:grid;grid-template-columns:1fr auto;gap:var(--space-4);align-items:center;border-bottom:1px solid var(--rule)}
header h1{font:500 44px/48px var(--display);letter-spacing:-.01em;margin:0}
header h1 span{color:var(--color-carbon-ink)}
header p{font:italic 400 20px/28px var(--display);margin:0}
header svg{width:64px;height:64px}
main{display:grid;gap:var(--space-8);padding:var(--space-8);max-width:880px;margin:0 auto}
.card{background:var(--surface-raised);border:1px solid var(--rule);padding:var(--space-4)}
.card h2{font:500 30px/36px var(--display);margin:var(--space-1) 0 var(--space-4)}
label{display:block;margin-top:var(--space-4)}
input[type=text],textarea{display:block;width:100%;font:inherit;color:var(--ink);background:var(--surface);
 border:1px solid var(--rule);border-radius:2px;padding:var(--space-2);margin-top:var(--space-1)}
textarea{resize:vertical}
button{font:600 12px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
 background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:2px;
 padding:var(--space-2) var(--space-4);min-height:40px}
button.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
button[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button:disabled{opacity:.55;cursor:progress}
.row{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}

/* Acciones directas al agente */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.tile{display:block;text-align:left;text-transform:none;letter-spacing:0;padding:var(--space-4);
 background:var(--surface);color:var(--ink);border:1px solid var(--rule);min-height:88px}
.tile b{display:block;font:500 22px/28px var(--display)}
.tile span{display:block;font:400 14px/20px var(--sans);color:var(--ink-muted);margin-top:var(--space-1)}
.tile.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tile.primary span{color:var(--on-accent);opacity:.9}
.tile:hover:not(:disabled){border-color:var(--accent);outline:1px solid var(--accent)}
#chat{margin-top:var(--space-4)}
#chat .row{flex-wrap:nowrap;align-items:stretch}
#chat input{margin:0;flex:1}
#chat label{margin:0 0 var(--space-1)}

/* Respuesta del agente */
.answer{margin-top:var(--space-4)}
.answer:empty{display:none}
.reply{border-left:3px solid var(--accent);padding:var(--space-1) var(--space-4);white-space:pre-wrap}
.did{list-style:none;margin:var(--space-2) 0 0;padding:0 0 0 var(--space-4);font:14px/22px var(--mono);color:var(--ink-muted)}
.did .bad{opacity:.7}
.chips{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-2)}
.chip{text-transform:none;letter-spacing:0;font:600 14px/20px var(--sans);padding:var(--space-1) var(--space-4);
 border-radius:999px;min-height:36px}
.thinking{display:flex;align-items:center;gap:var(--space-2);color:var(--ink-muted)}
.dots i{display:inline-block;width:8px;height:8px;margin-right:4px;background:var(--accent);animation:pulse 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media(prefers-reduced-motion:reduce){.dots i{animation:none}}

/* Reporte guiado */
.step{margin-top:var(--space-4)}
.step>.label{display:block;margin:0 0 var(--space-2)}
.opts{display:flex;gap:var(--space-2);flex-wrap:wrap}
.opts label{margin:0;position:relative}
.opts input{position:absolute;opacity:0;width:1px;height:1px}
.opts span{display:inline-block;border:1px solid var(--rule);border-radius:999px;padding:var(--space-1) var(--space-4);
 font:600 14px/20px var(--sans);cursor:pointer;background:var(--surface)}
.opts input:checked+span{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.opts input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
details{margin-top:var(--space-4)}
summary{cursor:pointer;font:600 14px/22px var(--sans);color:var(--ink-muted)}

/* Lista */
.tabs{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-4)}
.inc{border-top:1px solid var(--rule);padding:var(--space-4) 0}
.inc:first-of-type{border-top:0;padding-top:0}
.inc h3{font:500 24px/30px var(--display);margin:var(--space-1) 0}
.inc.resuelta h3{text-decoration:line-through;color:var(--ink-muted)}
.inc.top{border-left:3px solid var(--accent);padding-left:var(--space-4)}
.inc.new{outline:2px solid var(--accent);outline-offset:6px}
.hint{color:var(--accent);margin-bottom:var(--space-1)}
.sev{display:inline-block;padding:0 var(--space-2);background:var(--surface);border:1px solid var(--rule)}
.sev.media{background:var(--status-note);color:var(--on-status);border-color:transparent}
.sev.alta{background:var(--status-warning);color:var(--on-status);border-color:transparent}
.sev.critica{background:var(--status-critical);color:var(--on-accent);border-color:transparent}
.sev.baja{background:var(--status-valid);color:var(--on-status);border-color:transparent}
.steps{margin:var(--space-1) 0 0;padding:0;list-style:none;font-family:var(--mono);font-size:14px;line-height:22px}
.steps li::before{content:"► "}
.acts{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-4)}
.empty{text-align:center;padding:var(--space-8) 0}
.err{color:var(--accent);font-weight:600}
.themes{display:flex;gap:var(--space-1);justify-content:flex-end;padding:var(--space-2) var(--space-8) 0}
#toast{position:fixed;left:50%;bottom:var(--space-4);transform:translateX(-50%);z-index:10;display:flex;gap:var(--space-4);
 align-items:center;background:var(--ink);color:var(--surface);padding:var(--space-2) var(--space-4);
 border-radius:2px;max-width:calc(100vw - 32px)}
#toast button{background:transparent;color:var(--surface);border-color:var(--surface)}
@media(max-width:820px){main{padding:var(--space-4)}.tiles{grid-template-columns:1fr}
 header{grid-template-columns:1fr;padding:var(--space-4)}header h1{font-size:36px;line-height:42px}header svg{display:none}
 .themes{padding:var(--space-2) var(--space-4) 0;flex-wrap:wrap}}
</style></head><body>
<nav class="themes" aria-label="Tema">
 <span id="who" class="small muted" style="align-self:center;margin-right:auto" hidden></span>
 <a id="out" class="label" href="/auth/logout" hidden style="align-self:center;border:1px solid var(--rule);padding:12px 16px;color:var(--ink);text-decoration:none;border-radius:2px">Salir</a>
 <span class="label muted" style="align-self:center">Tema //</span>
 <button class="ghost" data-theme="auto" aria-pressed="true">Auto</button>
 <button class="ghost" data-theme="light" aria-pressed="false">Papel</button>
 <button class="ghost" data-theme="dark" aria-pressed="false">Tinta</button>
 <button class="ghost" data-theme="contrast" aria-pressed="false">Alto contraste</button>
</nav>
<header>
 <div><h1>Inciden<span>cias</span></h1><p>Dile al agente qué pasa; él se encarga.</p></div>
 <svg viewBox="0 0 120 120" role="img" aria-label="Grafo de nodos">
  <g stroke="var(--color-carbon-ink)" stroke-width="3"><path d="M24 30L70 20M70 20L96 62M24 30L40 86M40 86L96 62M70 20L40 86"/></g>
  <g fill="var(--color-bone-parchment)"><circle cx="24" cy="30" r="10"/><circle cx="70" cy="20" r="8"/>
  <circle cx="96" cy="62" r="11"/><circle cx="40" cy="86" r="9"/></g></svg>
</header>
<main>
 <section class="card" aria-labelledby="ht"><span class="label muted">Inicio // Agente</span>
  <h2 id="ht">¿Qué necesitas hoy?</h2>
  <div class="tiles">
   <button class="tile primary" data-q="urgent"><b>Atender la más urgente</b><span>El agente la pasa a «en curso» y te da los primeros pasos</span></button>
   <button class="tile" data-q="first"><b>¿Qué atiendo primero?</b><span>Revisa lo pendiente y te dice cuál y por qué</span></button>
   <button class="tile" data-q="summary"><b>Resumen del día</b><span>Cómo está todo ahora, en pocas líneas</span></button>
   <button class="tile" id="open-report"><b>Reportar un problema</b><span>Dos toques: qué pasó y a quién afecta</span></button>
  </div>
  <div id="agent" class="answer" aria-live="polite"></div>
  <form id="chat"><label for="m" class="label muted">O escríbele lo que quieras</label>
   <div class="row"><input type="text" id="m" required maxlength="2000" autocomplete="off"
     placeholder="Ej.: cierra la de pagos"><button id="send">Enviar</button></div></form>
 </section>

 <form id="new" class="card" hidden><span class="label muted">Alta // Nueva incidencia</span>
  <h2>Reportar un problema</h2>
  <div class="step"><span class="label">1 · ¿Qué ha pasado?</span>
   <div class="chips" id="tpl" role="group" aria-label="Problemas frecuentes">
    <button type="button" class="ghost chip" data-t="Sistema caído o sin respuesta">Sistema caído</button>
    <button type="button" class="ghost chip" data-t="Todo va muy lento">Va muy lento</button>
    <button type="button" class="ghost chip" data-t="No puedo iniciar sesión">No puedo entrar</button>
    <button type="button" class="ghost chip" data-t="Error al guardar o enviar">Da error</button></div>
   <label for="t" class="label muted" style="margin-top:var(--space-2)">Escríbelo con tus palabras</label>
   <input type="text" id="t" maxlength="200" required placeholder="Ej.: No puedo entrar al sistema de pagos"></div>
  <div class="step"><span class="label">2 · ¿A quién afecta? <span class="muted">(opcional)</span></span>
   <div class="opts" role="radiogroup" aria-label="Impacto">
    <label><input type="radio" name="imp" value="Solo a mí"><span>Solo a mí</span></label>
    <label><input type="radio" name="imp" value="A mi equipo"><span>A mi equipo</span></label>
    <label><input type="radio" name="imp" value="A todos los clientes"><span>A todos los clientes</span></label></div></div>
  <details><summary>Añadir detalle (opcional)</summary>
   <label for="d" class="label muted">Qué sistema, desde cuándo…</label>
   <textarea id="d" rows="3"></textarea></details>
  <div class="row" style="margin-top:var(--space-4)"><button id="go">Reportar</button>
   <button type="button" class="ghost" id="cancel-report">Cancelar</button>
   <span id="ns" class="small muted" role="status"></span></div>
 </form>

 <section class="card" aria-labelledby="lt"><span class="label muted">Registro // Incidencias</span>
  <h2 id="lt">Requiere tu atención</h2>
  <div class="tabs" id="filters" role="group" aria-label="Filtro">
   <button class="ghost" data-f="pending" aria-pressed="true">Pendientes</button>
   <button class="ghost" data-f="resuelta" aria-pressed="false">Resueltas</button>
   <button class="ghost" data-f="all" aria-pressed="false">Todas</button></div>
  <div id="list" aria-live="polite"></div></section>
</main>
<div id="toast" role="status" hidden></div>
<script>
const $=id=>document.getElementById(id),LABEL={abierta:'Abierta',en_curso:'En curso',resuelta:'Resuelta'},SEV={critica:'crítica',sin_clasificar:'sin clasificar'};
const RANK={critica:0,alta:1,media:2,baja:3};
const DID={listar_incidencias:'Revisó las incidencias',clasificar_incidencia:'Clasificó la incidencia',cambiar_estado:'Cambió el estado'};
const Q={urgent:'Toma la incidencia pendiente más urgente: llama a listar_incidencias, luego a cambiar_estado con estado en_curso sobre la más urgente, y dime sus primeros pasos.',
 first:'¿Qué atiendo primero? Revisa las incidencias pendientes y dime cuál y por qué, en dos líneas.',
 summary:'Dame un resumen breve del estado actual de las incidencias.'};
let sid=null,items=[],filter='pending',busy=false,toastTimer=null;const inline={};
try{sid=localStorage.getItem('sid')}catch{}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
async function api(path,method,body){
 const r=await fetch(path,method?{method,headers:{'content-type':'application/json'},body:JSON.stringify(body)}:undefined);
 if(r.status===401){location.href="/";throw new Error("Tu sesión caducó")}
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("HTTP "+r.status));return j}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch{}
 document.querySelectorAll('.themes [data-theme]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===t))}
document.querySelectorAll('.themes [data-theme]').forEach(b=>b.onclick=()=>setTheme(b.dataset.theme));
try{setTheme(localStorage.getItem('theme')||'auto')}catch{}

function setBusy(v){busy=v;document.querySelectorAll('.tile,#send,#go,.acts button').forEach(b=>b.disabled=v)}
function thinking(msg){const d=el('div','thinking');d.setAttribute('role','status');
 const dots=el('span','dots');dots.setAttribute('aria-hidden','true');dots.append(el('i'),el('i'),el('i'));
 d.append(dots,el('span',null,msg||'El agente está trabajando…'));return d}
function toast(msg,undo){const t=$('toast');clearTimeout(toastTimer);t.replaceChildren(el('span',null,msg));
 if(undo){const b=el('button','ghost','Deshacer');b.onclick=()=>{t.hidden=true;undo()};t.append(b)}
 t.hidden=false;toastTimer=setTimeout(()=>{t.hidden=true},7000)}

/* Pregunta al agente y pinta la respuesta en `out`; refresca la lista porque pudo cambiar datos */
async function ask(q,out,chips){
 if(busy)return;setBusy(true);out.replaceChildren(thinking());
 try{const j=await api('/api/chat','POST',{message:q,session_id:sid});sid=j.session_id;
  try{localStorage.setItem('sid',sid)}catch{}
  out.replaceChildren(answer(j,chips));await load()}
 catch(x){const e=el('div');e.append(el('p','err','No pude hablar con el agente: '+x.message));
  const b=el('button','ghost chip','Reintentar');b.onclick=()=>{setBusy(false);ask(q,out,chips)};e.append(b);out.replaceChildren(e)}
 finally{setBusy(false)}}
function answer(j,chips){
 const d=el('div');d.append(el('div','label muted','Agente //'),el('div','reply',j.reply||'Hecho.'));
 if(j.actions&&j.actions.length){const u=el('ul','did');
  j.actions.forEach(a=>u.append(el('li',a.ok?'':'bad',(a.ok?'✓ ':'↻ ')+(DID[a.tool]||a.tool)+(a.ok?'':' (reintentó)'))));d.append(u)}
 if(chips){const c=el('div','chips');
  [['Atender la siguiente',()=>ask(Q.urgent,$('agent'),true)],['Resumen del día',()=>ask(Q.summary,$('agent'),true)],
   ['Nueva conversación',()=>{sid=null;try{localStorage.removeItem('sid')}catch{};$('agent').replaceChildren()}]]
   .forEach(([t,f])=>{const b=el('button','ghost chip',t);b.onclick=f;c.append(b)});d.append(c)}
 return d}
document.querySelectorAll('.tile[data-q]').forEach(b=>b.onclick=()=>ask(Q[b.dataset.q],$('agent'),true));
$('chat').onsubmit=e=>{e.preventDefault();const q=$('m').value.trim();if(!q)return;$('m').value='';ask(q,$('agent'),true)};

/* Lista priorizada */
function render(){
 const pend=items.filter(i=>i.status!=='resuelta'),done=items.filter(i=>i.status==='resuelta');
 const cnt={pending:pend.length,resuelta:done.length,all:items.length},name={pending:'Pendientes',resuelta:'Resueltas',all:'Todas'};
 document.querySelectorAll('#filters [data-f]').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.f===filter);
  b.textContent=`${name[b.dataset.f]} ${cnt[b.dataset.f]}`});
 const by=(a,b)=>(RANK[a.severity]??4)-(RANK[b.severity]??4)||b.created_at-a.created_at;
 const vis=(filter==='pending'?pend:filter==='resuelta'?done:items).slice().sort(by);
 const top=filter==='pending'&&vis[0]?vis[0].id:null;
 let nodes=vis.map(i=>card(i,i.id===top));
 if(!nodes.length){const e=el('div','empty');
  e.append(el('p',null,filter==='pending'?'Todo al día. No hay nada pendiente.':'Nada por aquí todavía.'));
  const b=el('button',null,'Reportar un problema');b.onclick=openReport;e.append(b);nodes=[e]}
 $('list').replaceChildren(...nodes)}
function card(i,isTop){
 const d=el('article','inc '+i.status+(isTop?' top':''));d.dataset.id=i.id;
 if(isTop)d.append(el('div','label hint','Sugerida // atender primero'));
 const r=el('div','row');r.append(el('span','sev label '+i.severity,SEV[i.severity]||i.severity),
  el('span','label muted',(i.category?i.category+' // ':'')+LABEL[i.status]));d.append(r,el('h3',null,i.title));
 if(i.summary)d.append(el('div','small',i.summary));
 if(i.next_steps&&i.next_steps.length&&i.status!=='resuelta'){const u=el('ul','steps');i.next_steps.forEach(s=>u.append(el('li',null,s)));d.append(u)}
 if(i.description){const x=el('details'),s=el('summary',null,'Ver descripción');x.append(s,el('div','small muted',i.description));d.append(x)}
 const next={abierta:['Empezar a atender','en_curso'],en_curso:['Marcar resuelta','resuelta'],resuelta:['Reabrir','abierta']}[i.status];
 const a=el('div','acts'),p=el('button',i.status==='resuelta'?'ghost':null,next[0]);
 p.setAttribute('aria-label',next[0]+': '+i.title);p.onclick=()=>setStatus(i,next[1]);
 const q=el('button','ghost','Preguntar al agente');q.setAttribute('aria-label','Preguntar al agente sobre: '+i.title);
 q.onclick=()=>ask(`Sobre la incidencia ${i.id} («${i.title}»): ¿qué hago ahora? Dame los siguientes pasos concretos.`,(inline[i.id]||=el('div','answer')),false);
 a.append(p,q);d.append(a,inline[i.id]||(inline[i.id]=el('div','answer')));return d}
async function setStatus(i,to){const prev=i.status;
 try{const u=await api('/api/incidents/'+i.id,'PATCH',{status:to});items=items.map(x=>x.id===u.id?u:x);render();
  toast(`«${i.title}» ahora está ${LABEL[to].toLowerCase()}.`,()=>setStatus(u,prev))}
 catch(e){toast('No se pudo cambiar: '+e.message);load()}}
async function load(){try{items=await api('/api/incidents');render()}catch(e){$('list').replaceChildren(el('p','err','Error: '+e.message))}}
document.querySelectorAll('#filters [data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});

/* Reporte guiado */
function openReport(){$('new').hidden=false;$('new').scrollIntoView({block:'start'});$('t').focus()}
$('open-report').onclick=openReport;
$('cancel-report').onclick=()=>{$('new').reset();$('ns').textContent='';$('new').hidden=true};
document.querySelectorAll('#tpl [data-t]').forEach(b=>b.onclick=()=>{$('t').value=b.dataset.t;$('t').focus()});
$('new').onsubmit=async e=>{e.preventDefault();if(busy)return;setBusy(true);
 $('ns').replaceChildren(thinking('El agente está revisando tu reporte…'));
 const imp=document.querySelector('input[name=imp]:checked');
 const desc=[imp?'Impacto: '+imp.value+'.':'',$('d').value.trim()].filter(Boolean).join('\n');
 try{const inc=await api('/api/incidents','POST',{title:$('t').value,description:desc});
  $('new').reset();$('ns').textContent='';$('new').hidden=true;filter='pending';await load();
  const ok=inc.severity&&inc.severity!=='sin_clasificar';
  toast(ok?`Listo: la clasifiqué como ${SEV[inc.severity]||inc.severity}${inc.category?' ('+inc.category+')':''}${inc.status==='en_curso'?' y la puse en curso':''}.`
   :'Quedó registrada, pero el agente no pudo clasificarla ahora. Pídeselo desde su tarjeta.');
  const n=document.querySelector(`[data-id="${inc.id}"]`);if(n){n.classList.add('new');n.scrollIntoView({block:'center'});setTimeout(()=>n.classList.remove('new'),5000)}}
 catch(x){$('ns').replaceChildren(el('span','err','No se pudo registrar: '+x.message))}finally{setBusy(false)}};
api("/api/me").then(m=>{if(!m.local){$("who").textContent=m.name+(m.email?" · "+m.email:"");$("who").hidden=false;$("out").hidden=false}}).catch(()=>{});
load();
</script></body></html>
